#Gluetun
  gluetun:
    image: qmcgaw/gluetun
    ports:
      - 5055:5055 #jellyseerr 
      - 6767:6767 #bazarr
      - 8080:8080 #qbit
      - 6881:6881 #qbit
      - 6881:6881/udp #qbit
      - 7878:7878 #radarr
      - 8989:8989 #sonarr
      - 9696:9696 #prowlarr
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=4Jub5h3t8hooHZOVLbw8dC6iUnumBZiet06TeQKqEG0=
      - WIREGUARD_ADDRESSES=10.14.0.2/16
      - SERVER_COUNTRIES=United Kingdom

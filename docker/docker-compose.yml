services:
#radarr
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /data/arr/radarr/config:/config
      - /data/arr/radarr/movies:/movies #optional
      - /data/arr/qbittorrent/downloads:/downloads #optional
    restart: unless-stopped

#Sonarr
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /data/arr/sonarr/config:/config
      - /data/arr/sonarr/tvseries:/tv #optional
      - /data/arr/qbittorrent/downloads:/downloads #optional
    restart: unless-stopped

#Prowlarr
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /data/arr/prowlarr/config:/config
    restart: unless-stopped

#qbittorrent
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /data/arr/qbittorrent/config:/config
      - /data/arr/qbittorrent/downloads:/downloads #optional
    restart: unless-stopped

#bazarr
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /data/arr/bazarr/config:/config
      - /data/arr/radarr/movies:/movies
      - /data/arr/sonarr/tvseries:/tv
    restart: unless-stopped

#jellyseerr
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    volumes:
      - /data/arr/jellyseerr/config:/app/config
    restart: unless-stopped

#jellyfin 
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=ETC/UTC
#      - JELLYFIN-PublishedServerUrl=http://192.168.0.5
    ports:
     - "0.0.0.0:8096:8096"
    volumes:
      - /data/arr/jellyfin/config:/config
      - /data/arr/sonarr/tvseries:/tvshows
      - /data/arr/radarr/movies:/movies
    restart: unless-stopped


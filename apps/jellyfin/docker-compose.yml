services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=ETC/UTC
    ports:
     - "8096:8096"
    volumes:
      - /data/arr/jellyfin/config:/config
      - /data/arr/sonarr/tvseries:/tvshows
      - /data/arr/radarr/movies:/movies
    restart: unless-stopped

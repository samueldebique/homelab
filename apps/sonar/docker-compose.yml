service:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/sonarr/config:/config
      - /path/to/tvseries:/tv 
      - /path/to/downloads:/downloads 
    restart: unless-stopped
